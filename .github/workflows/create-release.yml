name: Create Release on Manual Trigger

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the release'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Get version without v
      id: get-version-without-v
      run: |
        echo "version_without_v=$(echo ${{ github.event.inputs.version }} | sed 's/^v//')" >> $GITHUB_OUTPUT

    - name: Checkout default branch
      id: checkout-default-branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
  
    - name: Get changelog entry
      id: changelog_reader
      uses: mindsers/changelog-reader-action@v2
      with:
        version: ${{ github.event.inputs.version }}
        path: ./CHANGELOG.md
  
    - name: Checkout tag
      id: checkout-tag
      uses: actions/checkout@v4
      with:
        ref: 'refs/tags/${{ github.event.inputs.version }}'
        fetch-depth: 0

    - name: Substitute version, manifest, url and download link in system.json
      env:
        VERSION: ${{steps.get-version-without-v.outputs.version_without_v}}
        DOWNLOAD: https://github.com/${{github.repository}}/releases/download/${{github.event.inputs.version}}/castle-falkenstein.zip
        MANIFEST: https://github.com/${{github.repository}}/releases/latest/download/system.json
        URL: https://github.com/${{github.repository}}
      run: |
        jq --arg version "$VERSION" --arg download "$DOWNLOAD" --arg manifest "$MANIFEST" --arg url "$URL" \
          '.version = $version | .download = $download | .manifest = $manifest | .url = $url' \
          system.json > system.json.tmp && mv system.json.tmp system.json

    - name: Create minimal system zip file
      run: zip -r ./castle-falkenstein.zip system.json LICENSE src/ lang/ build/

    - name:  Create release
      id: create_version_release
      uses: ncipollo/release-action@v1
      with:
        name: Release ${{ github.event.inputs.version }}
        tag: ${{ github.event.inputs.version }}
        body: ${{ steps.changelog_reader.outputs.changes }}
        artifacts: './system.json, ./castle-falkenstein.zip'
        draft: false
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
